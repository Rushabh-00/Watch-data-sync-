name: Android build

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "9.6.0"

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Show Android SDK
        run: |
          sdkmanager --list_installed | sed -n '1,120p'
          echo "ANDROID_HOME=${ANDROID_HOME}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false
          cache-cleanup: on-success
          add-job-summary: on-failure

      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: android
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee ../build.log
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Report build failure
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          log = Path("build.log").read_text(errors="replace")
          tail = "\n".join(log.splitlines()[-160:])
          body = "### Android build failure\n\nCommit: " + "${{ github.sha }}" + "\n\n```text\n" + tail + "\n```"
          Path("comment.json").write_text(json.dumps({"body": body}))
          PY
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" --input comment.json

      - name: Publish direct APK
        if: steps.build.outcome == 'success'
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          NAME="WatchDataSync-debug.apk"
          test -f "$APK"
          cp "$APK" "$NAME"

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest \
              --title "Watch Data Sync - Latest APK" \
              --notes "Latest debug APK from commit ${{ github.sha }}." \
              --target "${{ github.sha }}"
            gh release upload latest "$NAME" --clobber
          else
            gh release create latest "$NAME" \
              --title "Watch Data Sync - Latest APK" \
              --notes "Latest debug APK from commit ${{ github.sha }}." \
              --prerelease \
              --target "${{ github.sha }}"
          fi

          echo "## Direct APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download WatchDataSync-debug.apk](https://github.com/${{ github.repository }}/releases/download/latest/${NAME})" >> "$GITHUB_STEP_SUMMARY"
