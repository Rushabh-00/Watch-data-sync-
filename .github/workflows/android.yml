name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-main
  cancel-in-progress: true

env:
  GRADLE_VERSION: '9.6.0'

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false
          cache-cleanup: on-success

      - name: Run JVM tests
        working-directory: android
        run: gradle test --configuration-cache --build-cache --parallel

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --configuration-cache --build-cache --parallel
